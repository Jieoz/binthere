# binthere /temp nginx block — merge INSIDE the vps.example.com server{} of
# /etc/nginx/conf/conf.d/v2ray.conf (before its final closing brace).
# Mount: static files under /home/wwwroot/papers/temp (this repo's public/ +
# api.php), API runs through the existing php7.0-fpm pool. No new services.

# ── binthere /temp (encrypted temp-file sharing) ─────────────────────────────
location = /temp { return 301 /temp/; }

# static assets (alias so /temp/css/... maps to .../papers/temp/css/...)
location ^~ /temp/ {
    alias /home/wwwroot/papers/temp/;
    index index.html;

    # share links look like /temp/p/<id>#key — SPA fallback answers index.html
    try_files $uri $uri/ /temp/index.html;

    # security headers (first-party only; mirrors the upstream CSP policy)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
}

# API → php-fpm. Nested INSIDE the static block so regex locations elsewhere
# in the server (e.g. the generic .php handler) can't intercept /temp/api/...
location ^~ /temp/api/ {
    include fastcgi_params;
    fastcgi_split_path_info ^(/temp/api\.php)(/.*)$;
    fastcgi_param SCRIPT_FILENAME /home/wwwroot/papers/temp/api.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_pass unix:/run/php/php7.0-fpm.sock;
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
    client_max_body_size 600m;   # chunk cap (512 MiB budget / 8 MiB chunks) + headroom
    client_body_buffer_size 1m;  # small bodies stay in memory; big ones spill to disk
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}

# internal: X-Accel-Redirect target for chunk downloads (never externally hit).
# api.php sends "X-Accel-Redirect: /_bt_internal/<abs-path>" — alias / re-roots.
location ^~ /_bt_internal/ {
    internal;
    alias /;
}
